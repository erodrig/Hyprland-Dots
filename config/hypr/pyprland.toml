[pyprland]

plugins = [
  "scratchpads",
  "magnify",
]

[scratchpads.term]
animation = "fromTop"
command = "kitty --class kitty-dropterm"
class = "kitty-dropterm"
size = "75% 60%"

[scratchpads.ncmpcpp]
animation = "fromTop"
command = "kitty --class ncmpcpp ncmpcpp"
class = "ncmpcpp"
size = "75% 60%"