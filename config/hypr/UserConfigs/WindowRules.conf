# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# User custom window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules
# This file will not be modified during dotfiles updates

# NOTES: Updated for Hyprland >= 0.53

# ============================================
# CUSTOM TAGS (not in base config)
# ============================================

# ZapZap WhatsApp client (add to im tag)
windowrule = match:class ^(ZapZap|com.rtosta.zapzap)$, tag +im

# Messaging tag for Zoom
windowrule = match:class ^([Zz]oom)$, tag +messaging

# ============================================
# WORKSPACE ASSIGNMENTS
# ============================================
windowrule = match:tag browser, workspace 1
windowrule = match:tag email, workspace 4
windowrule = match:tag gamestore, workspace 5
windowrule = match:tag messaging, workspace 5
windowrule = match:tag im, workspace 7
windowrule = match:tag games, workspace 8

# ============================================
# CUSTOM APP RULES
# ============================================

# Discord - floating on workspace 5
windowrule {
    name = Discord
    match:class = ^(com\.discordapp\.Discord|discord)$
    workspace = 5
    float = on
    opacity = 0.94 0.86
    size = (monitor_w*0.45) (monitor_h*0.5)
}

# Slack - tiled in special workspace
windowrule {
    name = Slack
    match:class = ^(Slack)$
    workspace = special
    tile = on
}

# Obsidian - tiled in special workspace
windowrule {
    name = Obsidian
    match:class = ^(obsidian)$
    workspace = special
    tile = on
}

# Steam main window - custom position and size
windowrule {
    name = Steam-main
    match:class = ^([Ss]team)$
    match:title = ^([Ss]team)$
    move = 49% 7%
    size = (monitor_w*0.5) (monitor_h*0.6)
}

# ncmpcpp music player
windowrule {
    name = ncmpcpp
    match:class = ^([Nn]cmpcpp)$
    float = on
    size = (monitor_w*0.45) (monitor_h*0.5)
    move = 50% 50%
}

# VS Code opacity
windowrule = match:class ^(code)$, opacity 0.8

# ============================================
# LAYER RULES (if not already in base)
# ============================================
# Note: Most layer rules are now in base config
