# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$files = nautilus
$term = kitty
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g.
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description
# Other the keybind search menu might not show it properly

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME

# settings for User defaults apps - set your default terminal andv file manager on this file
source= $UserConfigs/01-UserDefaults.conf

##############
#  Rebinds   #
##############

# ===========================================================================
#  Local keymap overrides  -  ALL our deviations from upstream live HERE
# ===========================================================================
# configs/Keybinds.conf is kept VERBATIM UPSTREAM so upgrade.sh can overwrite it
# freely and merges stay clean. This file is sourced at hyprland.conf:38, after
# configs/Keybinds.conf at line 14, so everything declared here wins.
#
# Rules, learned the hard way:
#  * Hyprland runs EVERY bind matching a combo, not just the last one. An
#    override MUST `unbind` the upstream bind first or BOTH fire. With TOGGLE
#    dispatchers (fullscreen / togglefloating / pseudo) a double fire cancels
#    itself into a silent no-op, which is nastier than the obvious double-action.
#  * `unbind` matches the keysym CASE-SENSITIVELY, even though Hyprland's runtime
#    key matching is case-INsensitive. Upstream spells some keys both ways
#    (`Tab` and `tab`) - every spelling needs its own unbind.
#  * Anything we still want must be re-declared AFTER its `unbind`.
#  * Where upstream already binds exactly what we want, declare NOTHING and let
#    upstream provide it: mod+F maximize, mod+SHIFT+I toggle split,
#    CTRL+ALT+P powermenu, mod+period / mod+comma workspace navigation.
#
# Audit for duplicates after any change (they produce NO config error):
#   hyprctl -j binds | python3 -c "import json,sys,collections; d=collections.defaultdict(list); [d[(b['modmask'],b.get('key','').lower())].append(b['dispatcher']) for b in json.load(sys.stdin)]; [print(k,v) for k,v in sorted(d.items()) if len(v)>1]"

# --- additions: upstream binds nothing on these combos, so no unbind needed ---
#bindr = $mainMod, $mainMod_L, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Super Key to Launch rofi menu
bind  = $mainMod, V, exec, $scriptsDir/nerd-dictation-toggle.sh
bindd = $mainMod ALT, F, fullscreen, fullscreen

# --- app launcher on mod+SPACE (upstream: float current window) ---
unbind = $mainMod, SPACE
bindd  = $mainMod, SPACE, app launcher, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window

# --- float all windows: direct dispatch instead of upstream's Float-all-Windows.sh ---
unbind = $mainMod ALT, SPACE
bindd  = $mainMod ALT, SPACE, Float all windows, exec, hyprctl dispatch workspaceopt allfloat

# --- float current window on mod+SHIFT+F (upstream: fullscreen) ---
# True fullscreen is on mod+ALT+F above; mod+SPACE, upstream's float key, is our launcher.
# mod+F keeps upstream's maximize (do NOT re-declare it - a second `fullscreen, 1`
# would toggle it straight back off). mod+CTRL+F is unbound upstream, left free.
unbind = $mainMod SHIFT, F
bindd  = $mainMod SHIFT, F, Float current window, togglefloating,

# --- toggle pseudo on mod+D (upstream: mod+D = app launcher, pseudo = mod+P) ---
# Pseudo cannot go back to its upstream key because mod+P is ours for screenshots.
unbind = $mainMod, D
bindd  = $mainMod, D, toggle pseudo (dwindle), pseudo,

# --- dropdown terminal: follow $term instead of upstream's hardcoded kitty ---
# Upstream notes Dropterminal is only certified with kitty; $term is kitty here anyway.
unbind = $mainMod SHIFT, Return
bindd  = $mainMod SHIFT, Return, DropDown terminal, exec, $scriptsDir/Dropterminal.sh $term
#bindd = $mainMod SHIFT, Return, DropDown terminal, exec, [float; move 15% 5%; size 70% 60%] $term

# --- Tab: group cycling only ---
# Upstream binds Tab TWICE - changegroupactive (as `Tab`) and workspace (as `tab`) -
# a collision present in stock KoolDots. We keep group cycling; workspace navigation
# stays on mod+period / mod+comma / mod+scroll (workspace e+-1, existing workspaces only,
# where the Tab binds used m+-1 and included empty ones).
# Both letter cases must be unbound - see the case-sensitivity rule above.
unbind = $mainMod, Tab
unbind = $mainMod, tab
unbind = $mainMod SHIFT, Tab
unbind = $mainMod SHIFT, tab
bindd  = $mainMod, Tab, Change Group Forward, changegroupactive, f
bindd  = $mainMod SHIFT, Tab, Change Group Back, changegroupactive, b

# --- special workspace on X (upstream: mod+U / mod+SHIFT+U) ---
unbind = $mainMod, U
unbind = $mainMod SHIFT, U
bindd  = $mainMod, X, toggle special workspace, togglespecialworkspace,
bindd  = $mainMod SHIFT, X, move to special workspace, movetoworkspace, special

# --- Screenshots on P: this keyboard has NO Print key ---
# Upstream puts screenshots on Print / SHIFT+Print / ... and pseudo on mod+P.
# Only mod+P needs an unbind: upstream leaves SHIFT+P, CTRL+P, CTRL+SHIFT+P and
# ALT+P free. Upstream's Print binds stay harmlessly bound - there is no Print key.
unbind = $mainMod, P
bindd  = $mainMod, P, screenshot now, exec, $scriptsDir/ScreenShot.sh --now
bindd  = $mainMod SHIFT, P, screenshot (area), exec, $scriptsDir/ScreenShot.sh --area
bindd  = $mainMod CTRL, P, screenshot in 5s, exec, $scriptsDir/ScreenShot.sh --in5
bindd  = $mainMod CTRL SHIFT, P, screenshot in 10s, exec, $scriptsDir/ScreenShot.sh --in10
bindd  = ALT, P, screenshot active window, exec, $scriptsDir/ScreenShot.sh --active

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

bindd = $mainMod SHIFT, Slash, Dropdown Music, exec, $scriptsDir/Dropmusic.sh
bindd = $mainMod, Z, Toggle zoom, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {if ($2 <= 1.1) print 2.0; else print 1.0}')"
