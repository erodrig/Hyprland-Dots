# MPD Configuration
music_directory     "/mnt/multimedia"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
log_file            "~/.config/mpd/log"
pid_file            "~/.config/mpd/pid"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"

# Network
bind_to_address     "127.0.0.1"
port                "6600"

# Audio output (PulseAudio/PipeWire)
audio_output {
    type    "pipewire"
    name    "PipeWire Sound Server"
}

# Fallback to PulseAudio if PipeWire doesn't work
#audio_output {
#    type    "pulse"
#    name    "PulseAudio Sound Server"
#}

# Optional: visualization data for ncmpcpp
audio_output {
    type    "fifo"
    name    "Visualizer"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
